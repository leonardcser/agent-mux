name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-build:
    name: Test and build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check native macOS build
        if: runner.os == 'macOS'
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --all-targets
          cargo build --locked --release
      - uses: astral-sh/setup-uv@v7
        if: runner.os == 'Linux'
        with:
          enable-cache: true
      - name: Install tmux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tmux
      - name: Check full suite
        if: runner.os == 'Linux'
        run: scripts/check --all
      - name: Upload failed E2E diagnostics
        if: failure() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: e2e-diagnostics
          if-no-files-found: ignore
          path: |
            /tmp/am-test-*/*.txt
            /tmp/am-test-*/child-*.log
            /tmp/am-test-*/state/*.log
            /tmp/am-test-*/state/*.json
