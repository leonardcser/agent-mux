[package]
name = "agent-mux"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"

[dependencies]
anyhow = "1.0.102"
chrono = { version = "0.4.45", features = ["serde"] }
crossterm = "0.29.0"
ctrlc = "3.5.2"
fs2 = "0.4.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.0"
smelt-perf = "0.3"
smelt-term = "0.7"
sysinfo = { version = "0.38", default-features = false, features = ["system"] }
toml = "1"

[dev-dependencies]
tempfile = "3.27.0"
